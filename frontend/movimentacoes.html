<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movimentações - Pastilhas DDA</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen">
    <header class="bg-white border-b border-slate-200">
        <div class="px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">

            <div class="flex items-center gap-4">
                <span class="text-brand-500 font-semibold text-xl">
                    Pastilhas DDA
                </span>

                <span class="text-slate-800 font-medium text-lg hidden sm:block">
                    Sistema de Controle de Estoque
                </span>

            </div>
            <div class="flex items-center gap-6">

                <span class="text-slate-600">
                    Usuário
                </span>

            </div>
        </div>

        <nav class="border-t border-slate-100 px-6 py-3"></nav>

    </header>

    <main class="p-6 max-w-7xl mx-auto">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-slate-800">
                Movimentações
            </h1>

            <p class="text-slate-500 mt-1">
                Registre entradas e saídas de pastilhas do estoque.
            </p>

        </div>


        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">

            <h2 class="text-lg font-semibold text-slate-800 mb-6">
                Registrar movimentação
            </h2>


            <form id="movimentacaoForm">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

                    <div>
                        <label
                            for="pastilhaId"
                            class="block text-sm font-medium text-slate-700 mb-2"
                        >
                            Pastilha
                        </label>

                        <select
                            id="pastilhaId"
                            required
                            class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >

                            <option value="">
                                Selecione uma pastilha
                            </option>

                        </select>

                    </div>


                    <div>
                        <label
                            for="tipoMovimentacao"
                            class="block text-sm font-medium text-slate-700 mb-2">Tipo
                        </label>

                        <select
                            id="tipoMovimentacao"
                            required
                            class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >

                            <option value="">
                                Selecione
                            </option>

                            <option value="ENTRADA">
                                Entrada
                            </option>

                            <option value="SAIDA">
                                Saída
                            </option>

                        </select>

                    </div>


                    <div>

                        <label
                            for="quantidadeMovimentacao"
                            class="block text-sm font-medium text-slate-700 mb-2"
                        >
                            Quantidade
                        </label>

                        <input
                            type="number"
                            id="quantidadeMovimentacao"
                            min="1"
                            required
                            placeholder="Ex: 10"
                            class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >

                    </div>

                </div>


                <div class="mt-6 flex justify-end">

                    <button
                        type="submit"
                        class="bg-slate-800 text-white px-6 py-2.5 rounded-lg hover:bg-slate-700 transition"
                    >
                        Registrar movimentação
                    </button>

                </div>

            </form>

        </section>


        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mt-6">

            <h2 class="text-lg font-semibold text-slate-800 mb-6">
                Histórico de movimentações
            </h2>

            <div class="overflow-x-auto">

                <table class="w-full text-left border-collapse">

                    <thead class="bg-slate-800 text-white">

                        <tr>

                            <th class="p-3 text-sm font-semibold">
                                ID
                            </th>

                            <th class="p-3 text-sm font-semibold">
                                Data
                            </th>

                            <th class="p-3 text-sm font-semibold">
                                Pastilha
                            </th>

                            <th class="p-3 text-sm font-semibold">
                                Tipo
                            </th>

                            <th class="p-3 text-sm font-semibold">
                                Quantidade
                            </th>

                        </tr>

                    </thead>

                    <tbody id="movimentacoesTable">

                        <tr>

                            <td
                                colspan="5"
                                class="p-6 text-center text-slate-500"
                            >
                                Carregando movimentações...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="assets/js/api.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/movimentacoes.js"></script>

</body>

</html>
